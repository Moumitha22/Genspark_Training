<section class="hero-section text-white d-flex align-items-center justify-content-center text-center">
  <div class="container">
    <div class="mb-4">
  <h1 class="fw-bold display-5">Explore Properties Across India</h1>
  <p class="lead">Discover a wide range of properties that match your needs!</p>
</div>


    <div class="mx-auto search-section-wrapper">
      <!-- Tabs Bar -->
      <div class="search-tabs-bar rounded-top px-4 py-3 d-flex gap-2">
        <button 
          class="tab-option"
          [ngClass]="{ 'active': searchModel.purpose === 'Sale' }"
          (click)="setPurpose('Sale')">
          BUY
        </button>
        <button 
          class="tab-option"
          [ngClass]="{ 'active': searchModel.purpose === 'Rent' }"
          (click)="setPurpose('Rent')">
          RENT
        </button>
        <a class="tab-option post-tab" routerLink="/post-property">POST</a>
      </div>

      <!-- Search Bar -->
      <div class="bg-white rounded-pill shadow-sm p-1">
        <div class="row g-2 align-items-center">
          <div class="col-3">
            <input 
              type="text" 
              class="form-control border-0 ps-3 location-input"
              placeholder="Enter city"
              [(ngModel)]="searchModel.location" />
          </div>
          <div class="col-7">
            <input 
              type="text" 
              class="form-control border-0 ps-3 search-input"
              placeholder="Search for apartments, villas, plots, or commercial spaces"
              [(ngModel)]="searchModel.keyword" />
          </div>
          <div class="col-2 text-center">
            <button class="btn btn-success w-100 rounded-pill fw-semibold btn-search" (click)="search()">
              Search
            </button>
          </div>
        </div>
      </div>
    </div>
  </div>
</section>
