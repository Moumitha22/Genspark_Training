<div class="modal-overlay">
  <div class="modal-dialog-scrollable">
    <div class="modal-header">
      <button type="button" class="btn-close ms-auto" (click)="close()" aria-label="Close"></button>
    </div>
    <div class="modal-body">
      <h4 class="modal-title mb-3 text-center">Compare Properties</h4>

      <div class="row text-center fw-bold">
        <div class="col-3 col-md-2"></div>
        <div class="col text-primary" *ngFor="let prop of selectedProperties">
          {{ prop.title }}
          <div class="small text-muted">{{ prop.location.locality }}, {{ prop.location.city }}</div>
        </div>
        <hr class="mb-4" />
      </div>

      <div class="row mb-2" *ngFor="let field of fieldsToCompare">
        <div class="col-3 col-md-2 fw-semibold">{{ field | titlecase }}</div>
        <div class="col" *ngFor="let prop of selectedProperties">
          <div class="text-center">{{ getField(prop, field) }}</div>
        </div>
      </div>
    </div>
  </div>
</div>
