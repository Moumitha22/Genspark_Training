<div>
    <div class="text-center mb-4">
        <h4>Quick Guidelines</h4>
    </div>
    <div class="guideline-card d-flex align-items-center gap-3 mb-4" *ngFor="let g of guidelines">
        <div class="icon-wrap">
        <i class="{{ g.icon }} text-white"></i>
        </div>
        <div class="card-content">
        <h5 class="card-title">{{ g.title }}</h5>
        <p class="card-text">{{ g.text }}</p>
        </div>
    </div>
</div>
