<div class="core-filters-sticky bg-light shadow-sm">
  <div class="container py-3" *ngIf="!loading && !errorMessage && allProperties.length > 0">
    <app-core-filters
    [model]="filterModel"
    (filtersChanged)="onFiltersChanged($event)">
  </app-core-filters>
</div>
</div>

<div class="container-fluid py-4">
  <div class="container">

    <!-- Error Message -->
    <div *ngIf="errorMessage && !loading" class="alert alert-danger mb-4">
      <div class="text-center">{{ errorMessage }}</div>
    </div>

    <!-- Empty State -->
    <div *ngIf="!loading && !errorMessage && allProperties.length === 0" class="text-center text-muted mt-4">
      <p>No properties found. Start posting to see them here!</p>
      <a class="btn btn-primary" routerLink="/post-property">Post Property</a>
    </div>
    
    <div class="row">
      <div class="col-lg-3 mb-4" *ngIf="!loading && !errorMessage && allProperties.length > 0">
        <label for="statusFilter" class="form-label fw-bold me-2">Filter By Status</label>
        <select class="form-select" id="statusFilter"
                [(ngModel)]="filterModel.status"
                (change)="applyFiltersAndSorting()"
                style="max-width: 250px;">
          <option [ngValue]="undefined">All Statuses</option>
          <option value="Available">Available</option>
          <option value="Sold">Sold</option>
          <option value="Rented">Rented</option>
        </select>
      </div>

      <div class="col-lg-9">

        <!-- Loading Spinner -->
        <div *ngIf="loading" class="text-center mb-4">
          <div class="spinner-border text-success" role="status"></div>
        </div>

        <!-- Filter Empty State -->
        <div *ngIf="!loading && !errorMessage && filteredProperties.length === 0" class="text-center text-muted mt-4">
          <p>No properties match you filter!</p>
           <button class="btn btn-primary" (click)="clearAllFilters()">Clear Filters</button>
        </div>

        <!-- Property Cards -->
        <div class="d-flex flex-column gap-3">
          <app-property-card *ngFor="let property of paginatedProperties" [property]="property" context="lister"
              [isDicountClickable]="false"
          ></app-property-card>
        </div>

        <!-- Pagination -->
        <div *ngIf="totalPages > 1" class="mt-4">
          <app-pagination
          [currentPage]="currentPage"
          [totalPages]="totalPages"
          (pageChange)="onPageChange($event)">
          </app-pagination>
        </div>
      </div>
    </div>
  </div>
</div>
