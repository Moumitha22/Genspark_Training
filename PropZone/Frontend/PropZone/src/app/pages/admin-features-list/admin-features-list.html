<div class="container mt-4">
  <h2 class="mb-0 text-center">Features</h2>

  <!-- Loading Spinner -->
  <div *ngIf="loading" class="text-center mb-4">
    <div class="spinner-border text-success" role="status"></div>
  </div>

  <!-- Error Message -->
  <div *ngIf="error && !loading" class="alert alert-danger my-4">
      <div class="text-center">{{ error }}</div>
  </div>

  <!-- Empty state -->
  <div *ngIf="!loading && !error && features.length === 0">
    <p>No features available.</p>
  </div>

  <div class="d-flex justify-content-end align-items-center mb-3" *ngIf="!loading && !error">
    <button class="btn btn-outline-primary responsive-btn" (click)="openFeatureModal()">+ Add Feature</button>
  </div>

  <div class="custom-scroll-wrapper shadow">
    <table *ngIf="!loading && features.length > 0" class="table table-hover align-middle hover-table feature-table">
      <thead class="sticky-header">
      <tr>
        <th>#</th>
        <th>Name</th>
        <th>Data Type</th>
        <th>Filter Mode</th>
        <th>Options</th>
        <!-- <th>Property Types</th>
        <th>Listing Purposes</th> -->
        <th colspan="2">Property Type & Listing Purpose</th>
        <th>Actions</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let feature of features; let i = index" >
        <td>{{ i + 1 }}</td>
        <td><div class="fw-semibold">{{ feature.name }}</div></td>
        <td>{{ feature.dataType }}</td>
        <td>{{ feature.filterMode }}</td>
        <td>
          <ul *ngIf="feature.options?.length; else noOptions">
            <li *ngFor="let opt of feature.options">{{ opt.value }}</li>
          </ul>
          <ng-template #noOptions><span class="text-muted">-</span></ng-template>
        </td>
        <!-- <td>
          <div *ngFor="let pair of getTypePurposeMap(feature)">
            <span class="badge bg-primary">{{ pair.type }}</span>
          </div>
        </td>
        <td>
          <div *ngFor="let pair of getTypePurposeMap(feature)">
            <span *ngFor="let p of pair.purposes" class="badge bg-info me-1">{{ p }}</span>
          </div>
        </td> -->
        <td colspan="2" class="p-0">
          <table class="table table-sm mb-0">
            <tbody>
              <tr *ngFor="let pair of getTypePurposeMap(feature)">
                <td class="border-0" style="width: 40%">
                  <span class="badge bg-primary">{{ pair.type }}</span>
                </td>
                <td class="border-0">
                  <span *ngFor="let p of pair.purposes" class="badge bg-info me-1">{{ p }}</span>
                </td>
              </tr>
            </tbody>
          </table>
        </td>
        <td style="white-space: nowrap; min-width: 120px;">
          <div class="d-inline-flex gap-2">
            <button class="btn btn-sm btn-primary" (click)="onEdit(feature)">
              <i class="fas fa-edit"></i>
            </button>

            <button class="btn btn-sm btn-danger" (click)="onDelete(feature.id)">
              <i class="fas fa-trash-alt"></i>
            </button>
          </div>
        </td>

      </tr>
    </tbody>
  </table>
  </div>

  <app-admin-feature-form
    [show]="showFeatureModal"
    [featureToEdit]="featureToEdit"
    (close)="handleFeatureModalClose($event)">
  </app-admin-feature-form>


</div>
