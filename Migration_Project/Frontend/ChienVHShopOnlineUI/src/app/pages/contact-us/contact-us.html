<div class="container mt-5">
  <h2>Contact Us</h2>

  <form [formGroup]="contactForm" (ngSubmit)="onSubmit()" novalidate>
    <div class="form-group mb-3">
      <label>Name</label>
      <input formControlName="name" type="text" class="form-control" required />
    </div>

    <div class="form-group mb-3">
      <label>Email</label>
      <input formControlName="email" type="email" class="form-control" required />
    </div>

    <div class="form-group mb-3">
      <label>Phone</label>
      <input formControlName="phone" type="text" class="form-control" required />
    </div>

    <div class="form-group mb-3">
      <label>Message</label>
      <textarea formControlName="content" rows="4" class="form-control" required></textarea>
    </div>

   <app-recaptcha-wrapper
    [siteKey]="siteKey"
    (token)="onCaptchaResolved($event)"
    ></app-recaptcha-wrapper>


    <button type="submit" class="btn btn-primary" [disabled]="isSubmitting">
      {{ isSubmitting ? 'Submitting...' : 'Submit' }}
    </button>
  </form>

  <div *ngIf="message" class="alert alert-success mt-3">{{ message }}</div>
  <div *ngIf="error" class="alert alert-danger mt-3">{{ error }}</div>
</div>
