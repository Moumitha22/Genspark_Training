<div
  class="card h-100 shadow border product-card"
>
  <img
    *ngIf="product.image"
    [src]="imageBaseUrl + product.image"
    class="card-img-top"
    alt="{{ product.productName }}"
  />

  <div class="card-body d-flex flex-column">
    <h5 class="card-title fw-bold">{{ product.productName }}</h5>

    <p class="card-text medium mb-2" *ngIf="product.modelName">
      <i class="bi bi-box-seam me-2 feature-icon"></i>
      <strong>Model:</strong> {{ product.modelName }}
    </p>

    <p class="card-text medium mb-2" *ngIf="product.categoryName">
      <i class="bi bi-diagram-3-fill me-2 feature-icon"></i>
      <strong>Category:</strong> {{ product.categoryName }}
    </p>

    <p class="card-text medium mb-2" *ngIf="product.colorName">
      <i class="bi bi-palette-fill me-2 feature-icon"></i>
      <strong>Color:</strong> {{ product.colorName }}
    </p>

    <p class="card-text medium mb-2" *ngIf="product.storageName">
      <i class="bi bi-hdd-fill me-2 feature-icon"></i>
      <strong>Storage:</strong> {{ product.storageName }}
    </p>

    <p class="card-text medium mb-2" *ngIf="product.price !== undefined">
      <i class="bi bi-cash-stack me-2 feature-icon"></i>
      <strong>Price:</strong>
      <span class="text-success"> {{ product.price }}$</span>
    </p>
    
     <ng-container *ngIf="role === 'User'">
       <div class="mt-auto d-flex justify-content-center gap-3">
        <button
          class="btn btn-primary w-100"
        (click)="addToCart()"
        >
          <i class="bi bi-cart-plus-fill me-1"></i> Add To Cart
        </button>
      </div>
    </ng-container>

     <ng-container *ngIf="role === 'Admin'">
      <a
      class="btn btn-outline-primary"
      [routerLink]="['/edit-product', product.id]"
      (click)="$event.stopPropagation()"
      >
        <i class="bi bi-pencil-fill me-1"></i> Edit
      </a>
    </ng-container>
  </div>
</div>
