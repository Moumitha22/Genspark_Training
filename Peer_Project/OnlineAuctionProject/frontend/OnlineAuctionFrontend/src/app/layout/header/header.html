<header
  class="fixed top-0 left-0 right-0 z-40 h-16 bg-gray-100 dark:bg-gray-800 flex items-center justify-between px-6 py-4 ml-0 sm:ml-64 text-gray-900 dark:text-gray-100"
>
  <div class="flex items-center justify-between w-full">
    <h1 class="text-xl font-semibold text-primary-color">Auction App</h1>
    <div class="flex items-center space-x-4">
      @if(role != 'Admin'){
      <app-notification class="mt-3"></app-notification>
      }
      <button
        (click)="setLightTheme()"
        class="px-4 py-2 rounded bg-white text-gray-800 hover:bg-gray-200 dark:bg-transparent"
      >
        <lucide-angular [img]="lightIcon" class="mt-0"></lucide-angular>
      </button>
      <button
        (click)="setDarkTheme()"
        class="px-4 py-2 rounded text-white hover:bg-gray-700 dark:bg-gray-900"
      >
        <lucide-angular [img]="darkIcon" class="mt-0"></lucide-angular>
      </button>
    </div>
  </div>
</header>
