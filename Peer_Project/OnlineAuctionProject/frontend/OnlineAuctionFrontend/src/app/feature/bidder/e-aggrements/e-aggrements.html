<div class="mt-4">
  <h1 class="text-2xl font-bold mb-4 text-primary-color">Your E-Agreements</h1>
</div>

<div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
  @if (paginatedEAgreementData && paginatedEAgreementData.length > 0) 
  { @for (e of paginatedEAgreementData; track $index) {
  <div
    class="bg-white dark:bg-gray-700 rounded-2xl shadow-xl p-6 flex flex-col justify-between border border-blue-200 dark:border-gray-800 hover:shadow-2xl transition-all duration-200"
  >
    <div class="mb-4">
      <div class="flex items-center mb-3">
        <span class="inline-flex items-center mr-3">
          <span
            class="flex items-center justify-center w-10 h-10 rounded-full bg-green-100 dark:bg-green-900"
          >
            <lucide-angular
              [img]="fileViewIcon"
              class="w-6 h-6 text-primary-color"
            ></lucide-angular>
            <svg
              class="w-4 h-4 text-green-500 absolute -bottom-1 -right-1 bg-white rounded-full border border-white"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              viewBox="0 0 24 24"
              style="margin-left: -18px; margin-top: 18px"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                d="M5 13l4 4L19 7"
              />
            </svg>
          </span>
          <span
            class="ml-2 text-green-600 dark:text-green-400 text-xs font-semibold flex items-center"
          >
            <lucide-angular
              [img]="checkIcon"
              class="w-4 h-4 mr-1"
            ></lucide-angular>
            Verified
          </span>
        </span>
      </div>
      <div
        class="grid grid-cols-1 md:grid-cols-2 gap-x-4 gap-y-2 bg-slate-100 dark:bg-gray-800 rounded-lg p-4"
      >
        <div>
          <div
            class="flex items-center text-xs text-primary-color font-bold tracking-wide uppercase mb-1"
          >
            <lucide-angular
              [img]="packageIcon"
              class="w-4 h-4 mr-1"
            ></lucide-angular>
            Auction Item ID
          </div>
          <div
            class="inline-block px-3 py-1 rounded-full bg-white dark:bg-gray-600 text-base font-semibold max-w-[160px] truncate cursor-pointer"
            title="{{e.auctionItemId}}"
          >
            {{e.auctionItemId}}
          </div>
        </div>
        <div>
          <div
            class="flex items-center text-xs text-primary-color font-bold tracking-wide uppercase mb-1"
          >
            <lucide-angular
              [img]="calenderIcon"
              class="w-4 h-4 mr-1"
            ></lucide-angular>
            Bid Time
          </div>
          <div class="text-base text-gray-900 dark:text-gray-100 font-medium">
            {{e.createdAt | date:'medium'}}
          </div>
        </div>
        <div>
          <div
            class="flex items-center text-xs text-primary-color font-bold tracking-wide uppercase mb-1"
          >
            <lucide-angular
              [img]="tagIcon"
              class="w-4 h-4 mr-1"
            ></lucide-angular>
            Bidding ID
          </div>
          <div
            class="inline-block px-3 py-1 rounded-full bg-white dark:bg-gray-600 text-base font-semibold max-w-[160px] truncate cursor-pointer"
            title="{{e.biddingId}}"
          >
            {{e.biddingId}}
          </div>
        </div>
        <div>
          <div
            class="flex items-center text-xs text-primary-color font-bold tracking-wide uppercase mb-1"
          >
            <lucide-angular
              [img]="awardIcon"
              class="w-4 h-4 mr-1"
            ></lucide-angular>
            Status
          </div>
          <div class="text-base text-gray-900 dark:text-gray-100 font-medium">
            win
          </div>
        </div>
      </div>
    </div>
    <div class="flex justify-end">
      <button
        class="flex items-center gap-2 px-5 py-2.5 rounded-lg bg-primary-color text-white transition font-semibold shadow btn-primary"
        (click)="getEAgreement(e.id)"
        title="View E-Agreement"
      >
        <lucide-angular
          [img]="fileViewIcon"
          class="w-5 h-5 text-white"
        ></lucide-angular>
        View E-Agreement
      </button>
    </div>
  </div>
  } } @else {
  <div class="col-span-full text-center py-10 text-gray-400 text-lg">
    No data available
  </div>
  }
</div>

<app-pagination
  [page]="page"
  [totalPages]="totalPages"
  (pageChange)="goToPage($event)"
></app-pagination>
