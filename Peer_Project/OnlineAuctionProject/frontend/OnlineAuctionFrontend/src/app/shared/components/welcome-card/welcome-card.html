<div
  class="relative overflow-hidden w-full h-40 rounded-lg cursor-pointer text-2xl font-bold bg-[#f5fcff] dark:bg-[#1e293b] transition-colors duration-500 shadow-md"
>
  <div class="z-10 absolute w-full h-full peer"></div>

  <div
    class="absolute -top-32 -left-16 w-32 h-44 rounded-full bg-primary-color dark:bg-[#334155] transition-all duration-500 peer-hover:-top-20 peer-hover:-left-16 peer-hover:w-[140%] peer-hover:h-[140%]"
  ></div>

  <div
    class="absolute flex text-xl text-center items-end justify-end text-black dark:text-white -bottom-32 -right-16 w-36 h-44 rounded-full bg-[#8edcf6] dark:bg-[#475569] transition-all duration-500 peer-hover:right-0 peer-hover:rounded-b-none peer-hover:bottom-0 peer-hover:items-center peer-hover:justify-center peer-hover:w-full peer-hover:h-full"
  >
    <div class="flex flex-col space-y-1">
      <p class="text-gray-600 dark:text-[#8edcf6]">
        {{ currentDateTime | date: 'short' }}
      </p>
      <p class="text-sm block">Today</p>
    </div>
  </div>

  <div
    class="w-full h-full items-center justify-center flex uppercase text-primary-color dark:text-white md:text-2xl text-sm"
  >
    Welcome
    <lucide-angular [img]="welcome" class="ml-1.5 mr-1.5"></lucide-angular>
    <br />
    <p>{{username}}</p>
  </div>
</div>
