version: "3.8"

services:
  db:
    image: postgres:15
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: root
      POSTGRES_DB: AuctionDB
    ports:
      - "5434:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
  api:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__DefaultConnection: "Host=db;Port=5432;Database=AuctionDB;Username=postgres;Password=root"
    ports:
      - "5001:8080"  
      - "5002:8081"
    depends_on:
      - db

volumes:
  pgdata: 
