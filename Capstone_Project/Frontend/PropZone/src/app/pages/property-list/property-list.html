<div class="core-filters-sticky bg-light shadow-sm">
  <div class="container py-3">
    <app-core-filters
      [model]="coreFilters"
      (filtersChanged)="onCoreFiltersChanged($event)"
    ></app-core-filters>
  </div>
</div>


<div class="container-fluid my-4">
  <div class="container">
    <div class="d-lg-none text-end mb-2">
      <button class="btn btn-outline-primary" (click)="toggleMobileFilters()">
        <i class="fas fa-sliders-h me-1"></i>
        {{ showMobileFilters ? 'Hide' : 'Show' }} Filters
      </button>

    </div>

    <div class="row">
      <div
        class="col-lg-3 mb-4"
        [ngClass]="{
          'd-none d-lg-block': !showMobileFilters,
          'd-block': showMobileFilters
        }"
      >
        <div class="sticky-filter-card card p-3 shadow-sm">
           <div class="d-flex justify-content-between align-items-center mb-2">
            <h5 class="mb-0">Filters</h5>
            <button class="btn btn-sm btn-primary" (click)="clearAllFilters()">Clear All</button>
          </div>

          <hr class="mt-0"/>

          <div class="filter-scroll-area">
            <div class="mb-4">
              <div class="mb-2 fw-semibold">Price</div>
              <div class="row g-2 align-items-center">
                <div class="col">
                  <input
                    type="number"
                    class="form-control"
                    placeholder="Min"
                    min="0"
                    [(ngModel)]="coreFilters.minPrice"
                    (ngModelChange)="onCoreFiltersChanged(coreFilters)"
                  />
                </div>
                <div class="col">
                  <input
                    type="number"
                    class="form-control"
                    placeholder="Max"
                    min="0"
                    [(ngModel)]="coreFilters.maxPrice"
                    (ngModelChange)="onCoreFiltersChanged(coreFilters)"
                  />
                </div>
              </div>
              <hr/>
            </div>
            <app-dynamic-filters
              [dynamicFilters]="dynamicFilters"
              (filtersChanged)="onDynamicFiltersChanged($event)"
            ></app-dynamic-filters>
          </div>
        </div>
      </div>

      <div class="col-lg-9">
        <div *ngIf="loading" class="text-center mb-4">
          <div class="spinner-border text-success" role="status"></div>
        </div>


        <div *ngIf="!loading && properties.length > 0">

         <div class="text-center mb-3 sticky-compare" *ngIf="canCompare">
            <button class="btn btn-warning" (click)="openCompareModal()">
              Compare Selected ({{ selectedPropertiesForComparison.length }})
            </button>
          </div>



          <div class="d-flex flex-column gap-3">
          <app-property-card
            *ngFor="let property of properties"
            [property]="property"
            [selected]="isPropertySelected(property.id)"
            (compareClicked)="toggleCompare(property)"
            (contactClicked)="handleContactClicked($event)"
            context="public"
            class="w-100"
          ></app-property-card>
          </div>
        </div>

        <div *ngIf="!loading && properties.length === 0">
          <p>No properties found.</p>
        </div>

        <div *ngIf="pagination.totalPages > 1" class="mt-4">
          <ul class="pagination justify-content-center">
            
            <li
              class="page-item"
              [class.disabled]="pagination.currentPage === 1"
            >
              <button class="page-link" (click)="onPageChange(pagination.currentPage - 1)">
                <i class="bi bi-chevron-left"></i>
              </button>
            </li>

            <li
              class="page-item"
              *ngFor="let page of [].constructor(pagination.totalPages); let i = index"
              [class.active]="pagination.currentPage === i + 1"
            >
              <button class="page-link page-number" (click)="onPageChange(i + 1)">
                {{ i + 1 }}
              </button>
            </li>

            <li
              class="page-item"
              [class.disabled]="pagination.currentPage === pagination.totalPages"
            >
              <button class="page-link" (click)="onPageChange(pagination.currentPage + 1)">
                <i class="bi bi-chevron-right"></i>
              </button>

            </li>
          </ul>
        </div>

      </div>
    </div>
  </div>
  <app-contact-lister-form
    *ngIf="selectedPropertyForContact"
    [property]="selectedPropertyForContact"
    (closed)="selectedPropertyForContact = null">
  </app-contact-lister-form>



  <!-- Compare Modal -->
  <div class="modal-overlay" *ngIf="showCompareModal">
    <div class="modal-dialog-scrollable">
      <div class="modal-header">
        <button type="button" class="btn-close ms-auto" (click)="clearComparison()" aria-label="Close"></button>
      </div>
      <div class="modal-body">
        <h4 class="modal-title mb-3 text-center">Compare Properties</h4>

        <div class="row text-center fw-bold">
          <div class="col-3 col-md-2"></div>
          <div class="col text-primary" *ngFor="let prop of selectedPropertiesForComparison">
            {{ prop.title }}
            <div class="small text-muted">{{ prop.location.locality }}, {{ prop.location.city }}</div>
          </div>
          <hr class="mb-4" />
        </div>

        <div
          class="row mb-2"
          *ngFor="let field of ['price', 'propertyType', 'areaSqFt', 'listerType', 'listingPurpose']"
        >
          <div class="col-3 col-md-2 fw-semibold">{{ field | titlecase }}</div>
          <div class="col" *ngFor="let prop of selectedPropertiesForComparison">
            <div class="text-center">{{ getPropertyField(prop, field) }}</div>
          </div>
        </div>
      </div>
    </div>
  </div>

  
</div>
