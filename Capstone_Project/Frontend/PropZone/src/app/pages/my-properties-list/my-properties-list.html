<div class="core-filters-sticky bg-light shadow-sm">
  <div class="container py-3" *ngIf="!loading && !errorMessage && allProperties.length > 0">
    <app-core-filters
      [model]="filterModel"
      (filtersChanged)="onFiltersChanged($event)">
    </app-core-filters>
  </div>
  <!-- Status Filter (only in My Properties) -->
  
</div>
<div class="container mt-3" *ngIf="!loading && !errorMessage && allProperties.length > 0">
  <div class="row justify-content-start">
    <div class="col-auto">
      <label for="statusFilter" class="form-label fw-bold me-2">Status:</label>
      <select class="form-select" id="statusFilter"
              [(ngModel)]="filterModel.status"
              (change)="applyFiltersAndSorting()"
              style="min-width: 150px;">
        <option [ngValue]="undefined">All</option>
        <option value="Available">Available</option>
        <option value="Sold">Sold</option>
        <option value="Rented">Rented</option>
      </select>
    </div>
  </div>
</div>

<div class="container py-4">
  
  <!-- Loading Spinner -->
  <div *ngIf="loading" class="text-center mb-4">
    <div class="spinner-border text-success" role="status"></div>
  </div>

  <!-- Error Message -->
  <div *ngIf="errorMessage && !loading" class="alert alert-danger mb-4">
    {{ errorMessage }}
  </div>

  <!-- Empty State -->
  <div *ngIf="!loading && !errorMessage && filteredProperties.length === 0" class="text-center text-muted mt-4">
    <p>No properties found. Start posting to see them here!</p>
    <a class="btn btn-primary" routerLink="/post-property">Post Property</a>
  </div>

  <!-- Property Cards -->
  <div class="row justify-content-center">
    <div class="col-12 col-md-11 mb-4" *ngFor="let property of paginatedProperties">
      <div class="d-block mx-auto" style="max-width: 1000px;">
        <app-property-card [property]="property" context="lister"></app-property-card>
      </div>
    </div>
  </div>

  <!-- Pagination -->
  <div *ngIf="totalPages > 1" class="mt-4">
    <ul class="pagination justify-content-center">

      <li class="page-item" [class.disabled]="currentPage === 1">
        <button class="page-link" (click)="onPageChange(currentPage - 1)">
          <i class="bi bi-chevron-left"></i>
        </button>
      </li>

      <li
        class="page-item"
        *ngFor="let page of [].constructor(totalPages); let i = index"
        [class.active]="currentPage === i + 1">
        <button class="page-link page-number" (click)="onPageChange(i + 1)">
          {{ i + 1 }}
        </button>
      </li>

      <li class="page-item" [class.disabled]="currentPage === totalPages">
        <button class="page-link" (click)="onPageChange(currentPage + 1)">
          <i class="bi bi-chevron-right"></i>
        </button>
      </li>

    </ul>
  </div>

</div>
