<div class="container py-4">

  <h3 class="text-center mb-4">Admin Dashboard</h3>

  <!-- Loading Spinner -->
  <div *ngIf="loading" class="text-center my-5">
    <div class="spinner-border text-primary" role="status"></div>
  </div>

  <!-- Dashboard Content -->
  <div *ngIf="!loading && data">
    
    <!-- Stat Cards -->
    <div class="row g-4 mb-5">
      <div class="col-md-4 col-lg-2">
        <div class="card dashboard-card text-center card-users shadow h-100 w-100">
          <div class="card-body">
            <i class="fas fa-users fs-2 mb-3"></i>
            <h5>Users</h5>
            <h3>{{ data?.totalUsers }}</h3>
          </div>
        </div>
      </div>

      <div class="col-md-4 col-lg-2">
        <div class="card dashboard-card text-center card-properties shadow">
          <div class="card-body">
            <i class="fas fa-building fs-2 mb-3"></i>
            <h5>Properties</h5>
            <h3>{{ data?.totalProperties }}</h3>
          </div>
        </div>
      </div>

      <div class="col-md-4 col-lg-2">
        <div class="card dashboard-card text-center card-listers shadow">
          <div class="card-body">
              <i class="fas fa-tag fa-2x mb-2"></i>
             <h5>For Sale</h5>
            <h3>{{ totalForSale}}</h3>
          </div>
        </div>
      </div>

      <div class="col-md-4 col-lg-2">
        <div class="card dashboard-card text-center card-inquiries shadow">
          <div class="card-body">
            <i class="fas fa-home fs-2 mb-3"></i>
            <h5>For Rent</h5>
            <h3>{{  totalForRent }}</h3>
          </div>
        </div>
      </div>

      <div class="col-md-4 col-lg-2">
        <div class="card dashboard-card text-center card-users shadow">
          <div class="card-body">
            <i class="fas fa-users fs-2 mb-3"></i>
            <h5>Listers</h5>
            <h3>{{ data?.totalActiveListers }}</h3>
          </div>
        </div>
      </div>

      <div class="col-md-4 col-lg-2">
        <div class="card dashboard-card text-center card-properties shadow">
          <div class="card-body">
            <i class="fas fa-envelope fs-2 mb-3"></i>
            <h5>Inquiries</h5>
            <h3>{{ data?.totalInquiries }}</h3>
          </div>
        </div>
      </div>
    </div>

    <!-- Charts -->
    <div class="row g-4 mb-5">
      <div class="col-md-6 col-lg-4">
        <div class="card shadow">
          <div class="px-3 pt-2 fs-5">Property Types</div>
          <div class="card-body">
            <canvas baseChart [data]="typeChartData" [type]="'pie'" [options]="chartOptions" [plugins]="[]"></canvas>
          </div>
        </div>
      </div>

      <div class="col-md-6 col-lg-4">
        <div class="card shadow">
          <div class="px-3 pt-2 fs-5">Listing Purpose</div>
          <div class="card-body">
            <canvas baseChart [data]="purposeChartData" [type]="'doughnut'" [options]="chartOptions" [plugins]="[]"></canvas>
          </div>
        </div>
      </div>

      <div class="col-lg-4 card shadow">
        <div class="px-3 pt-2 fs-5">Property Status</div>
            <div class="d-flex justify-content-center align-items-center h-100 w-100">
            <div class="card-body" >
                <canvas baseChart
                [data]="statusChartData"
                [type]="'bar'"
                [options]="chartOptions"
                [plugins]="[]">
                </canvas>
            </div>
        </div>
    </div>
    </div>
  </div>
  <hr/>
 <app-admin-properties-list [maxCount]="5" class="mt-0"></app-admin-properties-list>

</div>
