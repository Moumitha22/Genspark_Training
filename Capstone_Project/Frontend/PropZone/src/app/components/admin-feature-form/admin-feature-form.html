<div class="feature-modal-overlay" *ngIf="show">
  <div class="feature-modal-content">
    <button type="button" class="btn-close" (click)="closeModal()" aria-label="Close"></button>

    <div class="mb-4 text-center">
      <strong class="section-heading fs-4">
        {{ featureToEdit ? 'Edit Feature' : 'Add Feature' }}
      </strong>
    </div>

    <div class="feature-modal-body">
      <form [formGroup]="form" (ngSubmit)="submit()">
        <div class="mb-3">
          <label class="form-label">Feature Name</label>
          <input class="form-control" formControlName="name" placeholder="e.g. Carpet Area" />
        </div>

        <div class="mb-3">
          <label class="form-label">Data Type</label>
          <select class="form-select" formControlName="dataType">
            <option value="Text">Text</option>
            <option value="Number">Number</option>
            <option value="Boolean">Boolean</option>
            <option value="Dropdown">Dropdown</option>
            <option value="MultiSelect">MultiSelect</option>
          </select>
        </div>

        <div class="mb-3" *ngIf="showOptionsSection">
          <label class="form-label">Options</label>
          <div *ngFor="let opt of options.controls; let i = index" class="d-flex gap-2 mb-2">
            <input class="form-control" [formControl]="opt" placeholder="Option value" />
            <button class="btn btn-danger btn-sm" type="button" (click)="removeOption(i)">×</button>
          </div>
          <button class="btn btn-outline-primary btn-sm" type="button" (click)="addOption()">+ Add Option</button>
        </div>

        <div class="mb-3">
          <label class="form-label">Filter Mode</label>
          <select class="form-select" formControlName="filterMode">
            <option value="Exact">Exact</option>
            <option value="Boolean">Boolean</option>
            <option value="Range">Range</option>
          </select>
        </div>

        <div class="mb-3">
          <label class="form-label">Applicability</label>
          <div *ngFor="let app of applicabilities.controls; let i = index" [formGroup]="app" class="d-flex gap-2 mb-2">
            <select class="form-select" formControlName="appliesToPurpose">
              <option *ngFor="let p of ['Sale', 'Rent']" [value]="p">{{ p }}</option>
            </select>
            <select class="form-select" formControlName="appliesToType">
              <option *ngFor="let t of ['Apartment', 'House', 'Plot', 'CommercialSpace']" [value]="t">{{ t }}</option>
            </select>
            <button class="btn btn-danger btn-sm" type="button" (click)="removeApplicability(i)">×</button>
          </div>
          <button class="btn btn-outline-secondary btn-sm" type="button" (click)="addApplicability()">+ Add Applicability</button>
        </div>
        <div class="text-danger mt-1"
            *ngIf="form.get('applicabilities')?.errors?.['minApplicability']
                    && (form.get('applicabilities')?.touched)">
          At least one applicability is required.
        </div>



        <div class="modal-footer d-flex justify-content-end mt-4">
          <button type="button" class="btn btn-secondary me-2" (click)="closeModal()">Cancel</button>
          <button type="submit" class="btn btn-primary">
            {{ featureToEdit ? 'Update Feature' : 'Create Feature' }}
          </button>
        </div>
      </form>
    </div>
  </div>
</div>
