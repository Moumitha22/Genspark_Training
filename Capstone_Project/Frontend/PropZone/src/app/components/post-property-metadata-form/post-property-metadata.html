<div class="container">
  <div class="form-box p-4 text-center shadow rounded bg-white">
    <label class="form-label d-block">Are you an Agent or Owner?</label>
    <div class="mb-3">
      <button class="btn btn-outline-primary me-2" [class.active]="listerType === 'Owner'" (click)="listerType = 'Owner'">Owner</button>
      <button class="btn btn-outline-primary" [class.active]="listerType === 'Agent'" (click)="listerType = 'Agent'">Agent</button>
    </div>

    <label class="form-label d-block">Is it for Sale or Rent?</label>
    <div class="mb-3">
      <button class="btn btn-outline-primary me-2" [class.active]="listingPurpose === 'Sale'" (click)="listingPurpose = 'Sale'">Sale</button>
      <button class="btn btn-outline-primary" [class.active]="listingPurpose === 'Rent'" (click)="listingPurpose = 'Rent'">Rent</button>
    </div>

    <label class="form-label d-block">What type of property?</label>
    <div class="mb-4">
      <button *ngFor="let type of propertyTypes"
              class="btn btn-outline-primary me-2 mb-2"
              [class.active]="propertyType === type"
              (click)="propertyType = type">
        {{ type }}
      </button>
    </div>

    <div class="d-flex justify-content-center">
      <button class="btn btn-primary" [disabled]="!isValid()" (click)="onNext()">Next</button>
    </div>
  </div>
</div>
